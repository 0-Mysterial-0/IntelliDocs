<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Pixel Art Black Background -->
  <rect width="32" height="32" fill="#000000"/>
  
  <!-- Pixel Outer Border Frame -->
  <rect x="2" y="2" width="28" height="28" fill="none" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Pixel Rake Body (White Outline) -->
  <rect x="7" y="7" width="18" height="13" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Pixel Windows (Solid White) -->
  <rect x="10" y="10" width="4" height="4" fill="#ffffff"/>
  <rect x="18" y="10" width="4" height="4" fill="#ffffff"/>
  
  <!-- Pixel Headlights (Solid White) -->
  <rect x="11" y="16" width="2" height="2" fill="#ffffff"/>
  <rect x="19" y="16" width="2" height="2" fill="#ffffff"/>
  
  <!-- Pixel Tracks & Support Pillars -->
  <rect x="4" y="23" width="24" height="2" fill="#ffffff"/>
  <rect x="8" y="25" width="2" height="4" fill="#ffffff"/>
  <rect x="22" y="25" width="2" height="4" fill="#ffffff"/>
</svg>
